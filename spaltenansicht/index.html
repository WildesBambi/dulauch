<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fafcfb">
<title>Spaltenansicht 😏</title>
<style>
* { box-sizing: border-box; }
html { background: #fafcfb; color: #102b21; }
body {
 margin: 0; min-height: 100vh; min-height: 100svh;
 display: grid; place-items: center;
 padding: clamp(20px, 5vw, 80px);
 font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
main { width: min(100%, 960px); }
p {
 margin: 0; display: grid; grid-template-columns: 1.35em 1fr;
 gap: .32em; font-size: clamp(1.25rem, 4.3vw, 3.2rem);
 font-weight: 650; line-height: 1.28; letter-spacing: -.025em;
}
p + p { margin-top: clamp(22px, 5svh, 52px); }
.reply { color: #4c6057; font-weight: 450; }
.punchline { color: #10643c; }
.emoji { letter-spacing: 0; white-space: nowrap; font-size: .9em; padding-top: .05em; }
strong { font-weight: 850; text-decoration: underline; text-decoration-color: #9bd6b7; text-decoration-thickness: .09em; text-underline-offset: .15em; }
@media (max-height: 500px) and (min-width: 550px) {
 body { padding: 18px 7vw; }
 p { font-size: clamp(1.25rem, 5.3svh, 2rem); }
 p + p { margin-top: 4svh; }
}
</style>
</head>
<body>
<main aria-label="Ein kleiner Flirt">
<p><span class="emoji">😏:</span><span>Bist du zufällig eine Excel-Tabelle?</span></p>
<p class="reply"><span class="emoji">🤔:</span><span>Nein, warum?</span></p>
<p class="punchline"><span class="emoji">😏:</span><span>Weil ich total an deiner <strong>Spaltenansicht</strong> interessiert bin.</span></p>
</main>
</body>
</html>
